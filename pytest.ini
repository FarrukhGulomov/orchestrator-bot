[pytest]
asyncio_mode = auto
testpaths = tests
# Without this, a bare `pytest` invocation (as opposed to `python -m
# pytest`, which auto-adds the cwd to sys.path) can't find the project's
# flat top-level modules (config.py, agents.py, telemetry.py, ...) from
# inside tests/ — this bit CI on the first run despite passing locally.
pythonpath = .
